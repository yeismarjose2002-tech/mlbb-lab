
name: Actualizar estadísticas de héroes

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rankings:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar, validar y guardar historial
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';

          const url = 'https://mlbbdex.com/api/v1/rankings';
          const MAX_AGE_DAYS = 3;
          const MAX_AGE_MS = MAX_AGE_DAYS * 24 * 60 * 60 * 1000;

          console.log('Consultando estadísticas de MLBB Dex...');

          const response = await fetch(url);

          if (!response.ok) {
            throw new Error(`Error de API: ${response.status}`);
          }

          const result = await response.json();
          const heroes = result?.data?.heroes;
          const measuredAt = result?.data?.measuredAt;

          if (!Array.isArray(heroes) || heroes.length === 0) {
            throw new Error('La API no devolvió estadísticas válidas.');
          }

          if (!measuredAt || Number.isNaN(Date.parse(measuredAt))) {
            throw new Error('La fecha de medición no es válida.');
          }

          const measurementTime = Date.parse(measuredAt);
          const age = Date.now() - measurementTime;

          if (age < -5 * 60 * 1000) {
            throw new Error('La medición tiene una fecha futura. Actualización rechazada.');
          }

          if (age > MAX_AGE_MS) {
            const ageDays = (age / (24 * 60 * 60 * 1000)).toFixed(1);

            throw new Error(
              `Datos obsoletos: la medición tiene ${ageDays} días. ` +
              `El máximo permitido es ${MAX_AGE_DAYS} días. ` +
              'Se conservarán los datos anteriores.'
            );
          }

          const required = [
            'slug', 'name', 'winRate',
            'banRate', 'pickRate', 'lowSample'
          ];

          for (const hero of heroes) {
            for (const field of required) {
              if (!(field in hero)) {
                throw new Error(
                  `Falta ${field} en ${hero.name ?? 'un héroe'}`
                );
              }
            }

            for (const field of ['winRate', 'banRate', 'pickRate']) {
              const value = hero[field];

              if (
                typeof value !== 'number' ||
                !Number.isFinite(value) ||
                value < 0 ||
                value > 100
              ) {
                throw new Error(
                  `${field} inválido en ${hero.name}`
                );
              }
            }

            if (typeof hero.lowSample !== 'boolean') {
              throw new Error(
                `lowSample inválido en ${hero.name}`
              );
            }
          }

          console.log(`Medición válida: ${measuredAt}`);
          console.log(`Héroes recibidos: ${heroes.length}`);

          const historyDir = 'history';
          fs.mkdirSync(historyDir, { recursive: true });

          const date = measuredAt.slice(0, 10);
          const time = measuredAt.slice(11, 19).replaceAll(':', '-');

          let historyFile = path.join(
            historyDir,
            `rankings-${date}.json`
          );

          const existingFiles = fs.readdirSync(historyDir);

          const alreadySaved = existingFiles.some(file => {
            if (!file.endsWith('.json')) return false;

            const saved = JSON.parse(
              fs.readFileSync(path.join(historyDir, file), 'utf8')
            );

            return saved?.data?.measuredAt === measuredAt;
          });

          if (!alreadySaved) {
            if (fs.existsSync(historyFile)) {
              historyFile = path.join(
                historyDir,
                `rankings-${date}-${time}.json`
              );
            }

            fs.writeFileSync(
              historyFile,
              JSON.stringify(result, null, 2) + '\n'
            );

            console.log(`Nueva captura histórica: ${historyFile}`);
          } else {
            console.log('Esta medición ya existe en el historial.');
          }

          fs.writeFileSync(
            'rankings.json',
            JSON.stringify(result, null, 2) + '\n'
          );

          console.log(`Se actualizaron ${heroes.length} héroes.`);
          console.log('Actualización completada correctamente.');
          EOF

      - name: Guardar actualización en GitHub
        run: |
          git config user.name "TUPA MLBB Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rankings.json history/

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar estadísticas e historial"
            git push
          fi
